name: Physical qualification stage
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      runner_labels:
        required: true
        type: string
      control_sha:
        required: true
        type: string
      run_key:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  execute:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.control_sha == github.sha
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 1440
    env:
      QUALIFICATION_STAGE: ${{ inputs.stage }}
      QUALIFICATION_RUN: ${{ inputs.run_key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.control_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualification-plan
          path: artifacts/qualification-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: stage-*
          path: artifacts/qualification-received
      - name: Execute exact stage with retained prerequisites
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QUALIFICATION_STAGE" =~ ^[a-zA-Z0-9-]+$ ]]
          [[ "$QUALIFICATION_RUN" =~ ^[0-9]+-[0-9]+$ ]]
          python3 tooling/bootstrap-toolchain.py
          .toolchain/bin/node tooling/qualification/ci/execute.mjs fetch-inputs --plan artifacts/qualification-plan/plan.json
          mkdir -p artifacts/qualification-stage artifacts/qualification-received
          .toolchain/bin/node tooling/qualification/ci/execute.mjs stage \
            --plan artifacts/qualification-plan/plan.json --stage "$QUALIFICATION_STAGE" \
            --received artifacts/qualification-received \
            --workspace "$RUNNER_TEMP/ideogram-ci-$QUALIFICATION_RUN" \
            --output "$PWD/artifacts/qualification-stage/$QUALIFICATION_STAGE"
      - name: Retain success, failure and partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage-${{ inputs.stage }}
          path: artifacts/qualification-stage/${{ inputs.stage }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
