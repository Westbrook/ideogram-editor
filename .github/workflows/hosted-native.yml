name: Hosted native prerequisites
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hosted-native-prerequisites
  cancel-in-progress: false
jobs:
  native-prerequisites:
    name: native-prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Record first executable step before checkout or setup
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 -I -S -B - "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$(id -u)" <<'PY'
          import json, os, re, stat, sys, time
          from pathlib import Path
          def require_marker_parent(path):
              if not path.is_absolute() or path.resolve(strict=True) != path:
                  raise ValueError('Canonical native marker parent required')
              for position, member in enumerate([path, *path.parents]):
                  info = member.lstat()
                  if not stat.S_ISDIR(info.st_mode) or info.st_uid != 0 or stat.S_IMODE(info.st_mode) & 0o022:
                      value = {'kind':'hosted-native-marker-ancestor-refusal-1','member':str(member),'position':position,'uid':info.st_uid,'gid':info.st_gid,'mode':format(stat.S_IMODE(info.st_mode),'04o'),'directory':stat.S_ISDIR(info.st_mode),'contentsRead':False}
                      raise ValueError(json.dumps(value,separators=(',',':')))
          run, attempt, head, uid = sys.argv[1:]
          assert run.isdecimal() and attempt.isdecimal() and re.fullmatch('[0-9a-f]{40}', head)
          assert os.getuid() == os.geteuid() == 0 and int(uid) > 0
          anchors = []
          for name in ('/', '/opt', '/var', '/var/lib'):
              try:
                  info = Path(name).lstat()
                  kind = 'directory' if stat.S_ISDIR(info.st_mode) else 'symlink' if stat.S_ISLNK(info.st_mode) else 'other'
                  anchors.append({'path':name,'uid':info.st_uid,'gid':info.st_gid,'mode':format(stat.S_IMODE(info.st_mode),'04o'),'type':kind,'canonical':Path(name).resolve(strict=True)==Path(name)})
              except OSError as error:
                  anchors.append({'path':name,'available':False,'errno':error.errno})
          print(json.dumps({'kind':'hosted-native-fixed-anchor-observation-1','setupMeasured':False,'authorityGranted':False,'contentsRead':False,'anchors':anchors},separators=(',',':')))
          value = {'kind':'hosted-native-first-step-1','run':int(run),'attempt':int(attempt),'head':head,'runnerUid':int(uid),'firstStepEpochMs':time.time_ns()//1000000,'meaning':'First executable workflow step; not the GitHub job.started_at deadline origin.'}
          path = Path('/var/lib') / ('ideogram-native-job-'+run+'-'+attempt+'.json')
          require_marker_parent(path.parent)
          fd = os.open(path, os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW, 0o444)
          with os.fdopen(fd,'w') as stream: json.dump(value,stream); stream.write('\n'); stream.flush(); os.fsync(stream.fileno())
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
        timeout-minutes: 5
      - name: Provision and authenticate unmeasured control host
        id: setup
        timeout-minutes: 60
        shell: bash
        env:
          IE_SETUP_TOKEN: ${{ github.token }}
          IE_SOURCE_SELECTION_SHA256: d7902a03fc45947b30d1350d03bbf3e3066ebdc528fa8f082a145a2f608bc5e2
        run: |
          set -euo pipefail
          printf '%s' "$IE_SETUP_TOKEN" | sudo -n /usr/bin/python3 -I -S -B tooling/rollback-producer/hosted-setup.py setup \
            --checkout "$GITHUB_WORKSPACE" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --head "$GITHUB_SHA" --source-sha256 "$IE_SOURCE_SELECTION_SHA256" >> "$GITHUB_OUTPUT"
      - name: Run fixed measured phases serially and stop on first failure
        id: phases
        shell: bash
        env:
          IE_CONTROL: ${{ steps.setup.outputs.control }}
          IE_CONTROL_NODE: ${{ steps.setup.outputs.node }}
          IE_CONFIG: ${{ steps.setup.outputs.config }}
          IE_GRANT: ${{ steps.setup.outputs.grant }}
        run: |
          set -euo pipefail
          for phase in inputs toolchain build16 build17 build18 verify16 verify17 verify18; do
            echo "attempted=$phase" >> "$GITHUB_OUTPUT"
            sudo -n "$IE_CONTROL_NODE" --import "$IE_CONTROL/tests/store/no-network.mjs" \
              "$IE_CONTROL/tooling/rollback-producer/hosted-control.mjs" \
              --config "$IE_CONFIG" --grant "$IE_GRANT" --phase "$phase" || exit "$?"
          done
      - name: Export only actually closed phases without changing originals
        id: export
        if: ${{ always() && steps.setup.outcome == 'success' && steps.phases.outputs.attempted != '' }}
        timeout-minutes: 21
        shell: bash
        env:
          IE_CONTROL: ${{ steps.setup.outputs.control }}
          IE_CONTROL_NODE: ${{ steps.setup.outputs.node }}
          IE_CONFIG: ${{ steps.setup.outputs.config }}
          IE_GRANT: ${{ steps.setup.outputs.grant }}
          IE_ATTEMPTED: ${{ steps.phases.outputs.attempted }}
        run: |
          set -euo pipefail
          if through="$(sudo -n "$IE_CONTROL/bin/python" -I -S -B "$IE_CONTROL/tooling/rollback-producer/hosted-setup.py" export-phase \
            --config "$IE_CONFIG" --grant "$IE_GRANT" --attempted "$IE_ATTEMPTED")"; then
            sudo -n "$IE_CONTROL_NODE" --import "$IE_CONTROL/tests/store/no-network.mjs" \
              "$IE_CONTROL/tooling/rollback-producer/hosted-control.mjs" \
              --config "$IE_CONFIG" --grant "$IE_GRANT" --export "$through"
          else
            export_status=$?
            # Preserve refusal and the uncertain lease. This separate projection
            # reads only fixed controller records and grants no closed export.
            printf '%s' "$IE_GRANT" | sudo -n "$IE_CONTROL/bin/python" -I -S -B \
              "$IE_CONTROL/tooling/rollback-producer/hosted-setup.py" failure-diagnostics \
              --config "$IE_CONFIG" --attempted "$IE_ATTEMPTED" || echo 'Bounded controller diagnostics unavailable; original export refusal retained.'
            exit "$export_status"
          fi
      - name: Retain bounded completed export or partial export diagnostics
        if: ${{ always() && steps.setup.outputs.safe_export_parent != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.setup.outputs.safe_export_parent }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
