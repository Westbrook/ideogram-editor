name: Fast validation
on:
  pull_request:
  workflow_dispatch:
    inputs:
      node_files:
        description: Comma-separated registered tests/** whole Node files; leave blank for browser selection
        required: false
        type: string
        default: ''
      browser_family:
        description: One complete current-root family; adapters and shell require Chromium; none preserves Node/default behavior
        required: false
        type: choice
        default: none
        options:
          - none
          - editor-authoring
          - editor-composition-save
          - editor-composition
          - editor-destination
          - editor-destination-cancellation
          - editor-destination-success
          - editor-error-monitor
          - editor-export
          - editor-export-destination-commit
          - editor-failures
          - editor-image-import
          - editor-integration-reads
          - editor-interactions
          - editor-journey
          - editor-native-text
          - editor-owned-opfs
          - editor-portable
          - editor-recovery
          - editor-recovery-copy
          - editor-storage-library
          - editor-tool-rail
          - editor-zoom-tool
          - editor-display-image
          - editor-candidate-comparison
          - editor-document-creation
          - editor-command-search
          - e1
          - request-review
          - request-v45-generation
          - request-v45-edit
          - queue
          - e2
          - e3
          - e4
          - adapters
          - text
          - shell
      browser:
        description: Pinned engine for the selected whole browser family
        required: false
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit
      e4_firefox_profiler:
        description: Diagnostic-only native sampling for whole E4 on Firefox and Ubuntu; never timing or resource qualification
        required: false
        type: boolean
        default: false
      host:
        description: Supplemental correctness host; neither option supplies physical qualification
        required: false
        type: choice
        options:
          - ubuntu-24.04
          - macos-15
        default: ubuntu-24.04
permissions:
  contents: read
concurrency:
  group: fast-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preflight-and-tooling:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.host == 'macos-15' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.node_files != '' || inputs.browser_family != '' && inputs.browser_family != 'none') && 180 || 20 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.node_files != '' || inputs.browser_family != '' && inputs.browser_family != 'none') && 5 || 20 }}
      - name: Validate optional E4 native profiler selection
        env:
          SELECTED_E4_FIREFOX_PROFILER: ${{ github.event_name == 'workflow_dispatch' && inputs.e4_firefox_profiler && 'true' || 'false' }}
          SELECTED_NODE_FILES: ${{ inputs.node_files || '' }}
          SELECTED_BROWSER_FAMILY: ${{ inputs.browser_family || 'none' }}
          SELECTED_BROWSER: ${{ inputs.browser || 'chromium' }}
          SELECTED_HOST: ${{ inputs.host || 'ubuntu-24.04' }}
        run: |
          if [ "$SELECTED_E4_FIREFOX_PROFILER" = 'false' ]; then
            exit 0
          fi
          if [ "$SELECTED_E4_FIREFOX_PROFILER" != 'true' ] || [ -n "$SELECTED_NODE_FILES" ] || [ "$SELECTED_BROWSER_FAMILY" != 'e4' ] || [ "$SELECTED_BROWSER" != 'firefox' ] || [ "$SELECTED_HOST" != 'ubuntu-24.04' ]; then
            echo 'E4_PROFILER_SELECTION' >&2
            exit 1
          fi
          echo 'IE_E4_FIREFOX_PROFILER=1' >> "$GITHUB_ENV"
      - name: Select pinned toolchain and verify inputs before install
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.node_files != '' || inputs.browser_family != '' && inputs.browser_family != 'none') && 5 || 20 }}
        env:
          EXPECTED_HOST: ${{ github.event_name == 'workflow_dispatch' && inputs.host == 'macos-15' && 'darwin-arm64' || 'linux-x64' }}
        run: |
          python3 -I -S - <<'PY'
          import os, platform
          architecture = {'aarch64': 'arm64', 'arm64': 'arm64', 'x86_64': 'x64'}.get(platform.machine())
          actual = platform.system().lower() + '-' + str(architecture)
          if actual != os.environ['EXPECTED_HOST']:
              raise SystemExit('Hosted platform differs from explicit selection: ' + actual)
          print('Supplemental correctness host: ' + actual + '; physical qualification: false')
          PY
          python3 tooling/bootstrap-toolchain.py
          python3 tooling/verify-vendor.py
          echo "$GITHUB_WORKSPACE/.toolchain/bin" >> "$GITHUB_PATH"
      - name: Install exact dependencies
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.node_files != '' || inputs.browser_family != '' && inputs.browser_family != 'none') && 10 || 20 }}
        run: |
          npm ci
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync,realpathSync,statSync} from 'node:fs';
          import {isAbsolute} from 'node:path';
          const configured=execFileSync('npm',['config','get','cache'],{encoding:'utf8',timeout:10000,maxBuffer:4096}).trim();
          if(!isAbsolute(configured))throw Error('Explicit npm install cache must be absolute');
          const cache=realpathSync(configured);
          if(/[\r\n]/.test(cache)||!statSync(cache).isDirectory())throw Error('Invalid npm install cache directory');
          appendFileSync(process.env.GITHUB_ENV,'IE_D11_NPM_CACHE='+cache+'\n');
          NODE
      - name: Allocate private evidence for supplemental correctness
        env:
          EVIDENCE_CAPACITY_BYTES: ${{ vars.QUALIFICATION_EVIDENCE_CAPACITY_BYTES }}
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,chmodSync,realpathSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const capacityBytes=Number(process.env.EVIDENCE_CAPACITY_BYTES);
          if(!Number.isSafeInteger(capacityBytes)||capacityBytes<=0)throw Error('Explicit allocated evidence capacity required');
          mkdirSync('artifacts/validation',{recursive:true,mode:0o700});
          chmodSync('artifacts/validation',0o700);
          const root=realpathSync('artifacts/validation'),allocation=join(root,'evidence-allocation.json');
          writeFileSync(allocation,JSON.stringify({kind:'evidence-volume-allocation-1',allocationId:'fast-validation',purpose:'qualification-evidence-only',capacityBytes,root,issuedAt:new Date().toISOString(),owner:'Build'})+'\n',{flag:'wx',mode:0o600});
          writeFileSync(process.env.GITHUB_ENV,'IE_EVIDENCE_ALLOCATION='+allocation+'\nIE_VALIDATION_OUTPUT='+join(root,'run')+'\n',{flag:'a'});
          NODE
      - name: Provision reviewed selected prerequisites
        if: github.event_name == 'workflow_dispatch' && (inputs.node_files != '' || inputs.browser_family != '' && inputs.browser_family != 'none')
        timeout-minutes: 20
        env:
          SELECTED_NODE_FILES: ${{ inputs.node_files }}
          SELECTED_BROWSER_FAMILY: ${{ inputs.browser_family || 'none' }}
          SELECTED_BROWSER: ${{ inputs.browser || 'chromium' }}
        run: node tooling/qualification/fast-ci-setup.mjs "$IE_VALIDATION_OUTPUT/../selected-setup.json"
      - name: Types, inventory, inputs and selected checks
        env:
          SELECTED_NODE_FILES: ${{ github.event_name == 'workflow_dispatch' && inputs.node_files || '' }}
          SELECTED_BROWSER_FAMILY: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_family || 'none' }}
          SELECTED_BROWSER: ${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'chromium' }}
        run: |
          node tooling/qualification/evidence-lifecycle.mjs root --allocation "$IE_EVIDENCE_ALLOCATION"
          if [ "$SELECTED_BROWSER_FAMILY" != 'none' ]; then
            npm run validate -- run --groups preflight --browsers "$SELECTED_BROWSER" --browser-groups "$SELECTED_BROWSER_FAMILY" --workers 1 --fresh --serial-browser --output "$IE_VALIDATION_OUTPUT"
          elif [ -n "$SELECTED_NODE_FILES" ]; then
            npm run validate -- run --groups all --node-files "$SELECTED_NODE_FILES" --browsers none --workers 1 --fresh --output "$IE_VALIDATION_OUTPUT"
          else
            npm run validate -- run --groups tooling --browsers none --workers 1 --fresh --output "$IE_VALIDATION_OUTPUT"
          fi
      - name: Retain failure and success receipts
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.node_files != '' || inputs.browser_family != '' && inputs.browser_family != 'none') && 10 || 20 }}
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fast-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/validation
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
# Manual macos-15 uses the standard arm64 runner for unchanged Darwin fixtures;
# PRs and omitted/other selections retain ubuntu-24.04. Fast feedback is supplemental.
# The trusted physical P pair and affected Q3,
# native/manual and capability obligations in qualification.yml remain required.
