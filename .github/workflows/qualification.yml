name: Ideogram qualification

on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Physical paired qualification or isolated container functionality
        required: true
        default: qualification
        type: choice
        options: [qualification, container]
      purpose:
        description: Paired comparison or first candidate-only full Q3 baseline
        required: true
        default: comparison
        type: choice
        options: [comparison, initial-baseline]
      candidate_sha:
        description: Full immutable maintainer-reviewed candidate SHA; blank selects dispatched default-branch commit
        required: false
        type: string
      base_sha:
        description: Full immutable base SHA (required for comparison; forbidden for initial baseline)
        required: false
        type: string
      base_image:
        description: 'Container only: ubuntu:24.04@sha256:<64 lowercase hex characters>'
        required: false
        type: string
      browser:
        description: Selected browser engines; feature scope also requires Chromium
        required: true
        default: all
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      scope:
        description: Base functional checks or feature integration checks
        required: true
        default: features
        type: choice
        options:
          - base
          - features

permissions:
  contents: read
  actions: read

concurrency:
  # One physical C/H pair across trusted dispatches; host locks reject overlap.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'qualification' && 'ideogram-qualification-physical-pair' || format('ideogram-functional-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  functional:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'container'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_IMAGE: ${{ inputs.base_image }}
      QUALIFICATION_BROWSER: ${{ inputs.browser }}
      QUALIFICATION_SCOPE: ${{ inputs.scope }}
      CONTAINER_NAME: ideogram-qualification-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require hosted schema18 packet provisioning
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/qualification-ci
          printf '%s\n' 'prerequisite-unavailable: hosted container schema18 packet provisioning has not been defined.' > artifacts/qualification-ci/prerequisite-status.txt
          echo '::error::Hosted container execution requires a reviewed platform-matching schema18 packet closure with every canonical absolute reference visible inside the container. No hosted provisioning contract is defined; toolchain, downloads and image build were not started.'
          exit 2
      - name: Validate input and retain source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_IMAGE" =~ ^ubuntu:24\.04@sha256:[a-f0-9]{64}$ ]]
          [[ "$QUALIFICATION_BROWSER" =~ ^(chromium|firefox|webkit|all)$ ]]
          [[ "$QUALIFICATION_SCOPE" =~ ^(base|features)$ ]]
          mkdir -p artifacts/qualification-ci
          git rev-parse HEAD > artifacts/qualification-ci/source-revision.txt
          git status --porcelain=v1 > artifacts/qualification-ci/source-status.txt
          docker version > artifacts/qualification-ci/docker-version.txt
      - name: Prepare sealed public and historical fixture closure
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/bootstrap-toolchain.py
          mkdir -p artifacts/ci-public-inputs
          ADAPTER_URL="$(.toolchain/bin/node --input-type=module -e "import {adapterSourceURL} from './tooling/qualification/container/inputs.mjs'; process.stdout.write(adapterSourceURL)")"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 600 \
            --output artifacts/ci-public-inputs/provider-example.safetensors "$ADAPTER_URL"
          .toolchain/bin/node tooling/qualification/container/inputs.mjs prepare \
            --adapter-fixture "$PWD/artifacts/ci-public-inputs/provider-example.safetensors"
      - name: Build isolated dependency and browser image
        shell: bash
        run: |
          set -euo pipefail
          docker build --progress=plain \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --iidfile artifacts/qualification-ci/image-id.txt \
            --file tooling/qualification/container/Dockerfile . \
            2>&1 | tee artifacts/qualification-ci/build.log
          docker image inspect "$(cat artifacts/qualification-ci/image-id.txt)" > artifacts/qualification-ci/image.json
      - name: Run gates without external networking
        shell: bash
        env:
          EVIDENCE_CAPACITY_BYTES: ${{ vars.QUALIFICATION_EVIDENCE_CAPACITY_BYTES }}
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_CAPACITY_BYTES" =~ ^[1-9][0-9]{0,14}$ ]]
          .toolchain/bin/node --input-type=module -e 'import {writeFileSync} from "node:fs"; const capacityBytes=Number(process.env.EVIDENCE_CAPACITY_BYTES); if(!Number.isSafeInteger(capacityBytes)||capacityBytes<=0)throw Error("Explicit allocated evidence capacity required"); writeFileSync("artifacts/qualification-ci/evidence-allocation.json",JSON.stringify({kind:"evidence-volume-allocation-1",allocationId:"container-evidence",purpose:"qualification-evidence-only",capacityBytes,root:"/workspace/artifacts",issuedAt:new Date().toISOString(),owner:"Build"})+"\n",{flag:"wx",mode:0o444});'
          docker run --name "$CONTAINER_NAME" --network none \
            --cap-drop ALL --security-opt no-new-privileges --shm-size=1g \
            --mount "type=bind,src=$PWD/artifacts/qualification-ci/evidence-allocation.json,dst=/evidence-allocation.json,readonly" \
            --env IE_EVIDENCE_ALLOCATION=/evidence-allocation.json \
            "$(cat artifacts/qualification-ci/image-id.txt)" "$QUALIFICATION_BROWSER" "$QUALIFICATION_SCOPE" \
            2>&1 | tee artifacts/qualification-ci/run.log
      - name: Retain successful and failed observations
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/qualification-ci
          if docker container inspect "$CONTAINER_NAME" > artifacts/qualification-ci/container.json 2>/dev/null; then
            docker cp "$CONTAINER_NAME:/workspace/artifacts/." artifacts/qualification-ci/container-artifacts
          fi
      - name: Upload functional gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/qualification-ci
            !artifacts/qualification-ci/**/qualification-container-inputs/**
            !artifacts/qualification-ci/**/p27-evidence/fal-public-lora-example/provider-example.safetensors
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false

  physical-qualification-required:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Disclose physical qualification boundary
        run: |
          echo 'PR validation does not execute code on physical C/H runners.'
          echo 'A maintainer must review the revision and dispatch qualification from the protected default branch.'
