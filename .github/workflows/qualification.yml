    needs: [plan, layer22]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.layer22.result == 'success' && fromJSON(needs.plan.outputs.layer23).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.layer23) }}
    uses: ./.github/workflows/qualification-stage.yml
    with:
      stage: ${{ matrix.stage }}
      runner_labels: ${{ toJSON(matrix.runnerLabels) }}
      control_sha: ${{ needs.plan.outputs.control }}
      run_key: ${{ github.run_id }}-${{ github.run_attempt }}


  disposition:
    if: always() && needs.plan.result == 'success'
    needs: [plan, layer00, layer01, layer02, layer03, layer04, layer05, layer06, layer07, layer08, layer09, layer10, layer11, layer12, layer13, layer14, layer15, layer16, layer17, layer18, layer19, layer20, layer21, layer22, layer23]
    runs-on: [self-hosted, ideogram-perf-C]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.control }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualification-plan
          path: artifacts/qualification-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: stage-*
          path: artifacts/qualification-received
      - name: Reproduce all required outcomes and pipeline boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/bootstrap-toolchain.py
          .toolchain/bin/node tooling/qualification/ci/execute.mjs fetch-inputs --plan artifacts/qualification-plan/plan.json
          .toolchain/bin/node tooling/qualification/ci/execute.mjs verify \
            --plan artifacts/qualification-plan/plan.json \
            --received artifacts/qualification-received \
            --output artifacts/qualification-disposition/result.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-disposition
          path: artifacts/qualification-disposition
          if-no-files-found: error
          retention-days: 90
