  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'qualification' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, ideogram-perf-C]
    timeout-minutes: 30
    outputs:
      candidate: ${{ steps.plan.outputs.candidate }}
      control: ${{ steps.plan.outputs.control }}
      layer00: ${{ steps.plan.outputs.layer00 }}
      layer01: ${{ steps.plan.outputs.layer01 }}
      layer02: ${{ steps.plan.outputs.layer02 }}
      layer03: ${{ steps.plan.outputs.layer03 }}
      layer04: ${{ steps.plan.outputs.layer04 }}
      layer05: ${{ steps.plan.outputs.layer05 }}
      layer06: ${{ steps.plan.outputs.layer06 }}
      layer07: ${{ steps.plan.outputs.layer07 }}
      layer08: ${{ steps.plan.outputs.layer08 }}
      layer09: ${{ steps.plan.outputs.layer09 }}
      layer10: ${{ steps.plan.outputs.layer10 }}
      layer11: ${{ steps.plan.outputs.layer11 }}
      layer12: ${{ steps.plan.outputs.layer12 }}
      layer13: ${{ steps.plan.outputs.layer13 }}
      layer14: ${{ steps.plan.outputs.layer14 }}
      layer15: ${{ steps.plan.outputs.layer15 }}
      layer16: ${{ steps.plan.outputs.layer16 }}
      layer17: ${{ steps.plan.outputs.layer17 }}
      layer18: ${{ steps.plan.outputs.layer18 }}
      layer19: ${{ steps.plan.outputs.layer19 }}
      layer20: ${{ steps.plan.outputs.layer20 }}
      layer21: ${{ steps.plan.outputs.layer21 }}
      layer22: ${{ steps.plan.outputs.layer22 }}
      layer23: ${{ steps.plan.outputs.layer23 }}
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
      QUALIFICATION_PURPOSE: ${{ inputs.purpose }}
      APPROVED_MAIN_PATH: ${{ vars.QUALIFICATION_APPROVED_MAIN_PATH }}
      APPROVED_MAIN_SHA256: ${{ vars.QUALIFICATION_APPROVED_MAIN_SHA256 }}
      APPROVED_MAIN_REVISION: ${{ vars.QUALIFICATION_APPROVED_MAIN_REVISION }}
      QUALIFICATION_INPUTS: ${{ vars.QUALIFICATION_INPUTS_PATH }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Provision protected control and seal reviewed source plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$QUALIFICATION_PURPOSE" =~ ^(comparison|initial-baseline)$ ]]
          test -n "$QUALIFICATION_INPUTS"
          git fetch --no-tags origin "$CANDIDATE_SHA"
          python3 tooling/bootstrap-toolchain.py
          mkdir -p artifacts/qualification-plan
          PLAN_ARGS=(plan --purpose "$QUALIFICATION_PURPOSE" --control "$GITHUB_SHA"
            --candidate "$CANDIDATE_SHA" --features adapters --cache normal
            --inputs "$QUALIFICATION_INPUTS" --output-root "artifacts/ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          if [[ "$QUALIFICATION_PURPOSE" == comparison ]]; then
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            git fetch --no-tags origin "$BASE_SHA"
            PLAN_ARGS+=(--base "$BASE_SHA")
            if [[ -n "$APPROVED_MAIN_PATH$APPROVED_MAIN_SHA256$APPROVED_MAIN_REVISION" ]]; then
              [[ "$APPROVED_MAIN_SHA256" =~ ^[a-f0-9]{64}$ ]]
              [[ "$APPROVED_MAIN_REVISION" =~ ^[a-f0-9]{40}$ ]]
              test -n "$APPROVED_MAIN_PATH"
              git fetch --no-tags origin "$APPROVED_MAIN_REVISION"
              PLAN_ARGS+=(--approved-main "$APPROVED_MAIN_PATH" --approved-main-sha256 "$APPROVED_MAIN_SHA256"
                --approved-main-revision "$APPROVED_MAIN_REVISION")
            fi
          else
            test -z "$BASE_SHA"
          fi
          .toolchain/bin/node tooling/qualification/ci/run.mjs "${PLAN_ARGS[@]}" > artifacts/qualification-plan/plan.json
          .toolchain/bin/node tooling/qualification/ci/execute.mjs outputs --plan artifacts/qualification-plan/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-plan
          path: artifacts/qualification-plan
          if-no-files-found: error
          retention-days: 90

